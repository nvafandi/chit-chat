name: Mobile Android Build & Distribute

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes'
        default: 'Build terbaru CHIT CHuT Android'
  push:
    branches: [mobile]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'index.ts'
      - '.github/workflows/mobile-deploy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native project (CNG)
        run: npx expo prebuild -p android --clean --no-install

      - name: Bundle JS for Android
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --entry-file index.ts --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res --dev false

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:88271262769:android:fb22bcd246d85f541af110
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: ${{ github.event.inputs.release_notes || 'Build terbaru CHIT CHuT Android' }}
